name: Publish release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
      - name: Fetch the reviewed native baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.1 --repo "$GITHUB_REPOSITORY" --pattern 'Seedsow-Lua-Editor-Save*' --dir build/reviewed-starter
          echo '3d935a182e7563d0dc19190ff3bd594d6fd21fd32cb3db6451b70c5f620df276  build/reviewed-starter/Seedsow-Lua-Editor-Save.zip' | sha256sum --check
      - name: Run regression and packaging checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/run_checks.py --base build/reviewed-starter/Seedsow-Lua-Editor-Save.zip
          python maintainer/check_starter.py --base build/reviewed-starter/Seedsow-Lua-Editor-Save.zip
          xvfb-run -a python tests/smoke_gui.py
          sh -n pi/install.sh
          python maintainer/package_save.py --base build/reviewed-starter/Seedsow-Lua-Editor-Save.zip
      - name: Publish the tagged version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          python -u maintainer/publish_release.py --ci-tag "$RELEASE_TAG"
